<div class="bg-[#f2f2f2] h-full pt-16 pb-6  flex flex-col gap-2 px-6 ">
    <div class="md:flex block  items-end justify-between">
        <div class="flex items-center gap-2">
            <mat-icon class="cursor-pointer" [routerLink]="['/manual-missing-order-sync']">
                keyboard_backspace
            </mat-icon>
            <div class="text-gray-900 font-medium text-md ">Sync History</div>
        </div>
        <div class="flex items-center gap-2 md:mt-0 mt-2 ">
            <p class="text-gray-900 font-normal text-xs cursor-pointer">
                Home /
            </p>
            <p class="text-gray-900 font-normal text-xs v">
                Manual Missing Order /
            </p>
            <p class="text-gray-500 font-normal text-xs">
                SyncSync History
            </p>
        </div>
    </div>

    <div class="bg-white rounded-t-md px-4 py-4 shadow-xs">
       
        <form>
            <div class="grid xl:grid-cols-4 md:grid-cols-2   gap-4 ">
                <!-- search list Order Id -->
                
                    <!-- Order Number -->
                    <mat-form-field class="w-full text-sm" appearance="outline" subscriptSizing="dynamic">
                        <mat-label class="text-sm ">Order Number</mat-label>
                        <input type="text" matInput class="text-sm ">
                    </mat-form-field>
              
                <div class="flex items-center justify-start">
                    <button type="submit"
                        class=" relative inline-flex group items-center justify-center px-4 py-1.5 text-white rounded-lg text-xs m-1 cursor-pointer active:shadow-none  bg-gradient-to-tr from-[#7231F1] to-[#8757E3] ">
                        <span
                            class="absolute w-0 h-0 transition-all duration-300 ease-out bg-white rounded-lg group-hover:w-full group-hover:h-10  opacity-10"></span>
                        <mat-icon class="text-lg pr-2">
                            search
                        </mat-icon>
                        <div class="relative">Search</div>
                    </button>
                    <button type="button"
                        class=" relative inline-flex group items-center justify-center px-4 py-1.5 text-gray-800 rounded-lg text-xs m-1 cursor-pointer  active:shadow-none  bg-gray-200 border-gray-300 border-[1px]">
                        <span
                            class="absolute w-0 h-0 transition-all duration-300 ease-out bg-gray-400 rounded-lg group-hover:w-full group-hover:h-10 opacity-10"></span>
                        <mat-icon class="text-sm pr-2 pt-[1px] text-gray-800">
                            not_interested
                        </mat-icon>
                        <div class="relative">Cancel</div>
                    </button>
                </div>
            </div>
            
        </form>
    </div>

    <div class="bg-white rounded-b-md px-4 py-4 shadow-lg">
        <div class=" overflow-x-auto">
            <table mat-table [dataSource]="dataSource" class="table-auto">
                <!-- SNo Column -->
                <ng-container matColumnDef="SNo">
                    <th mat-header-cell *matHeaderCellDef class="!bg-gray-50 text-xs !h-fit overflow-hidden text-ellipsis whitespace-nowrap">S No</th>
                    <td mat-cell *matCellDef="let element" class="!bg-white text-xs font-medium">
                        {{element.SNo}} </td>
                </ng-container>
                <!-- ListOfOrders Column -->
                <ng-container matColumnDef="ListOfOrders">
                    <th mat-header-cell *matHeaderCellDef class="!bg-gray-50 text-xs !h-fit"> List Of Orders </th>
                    <td mat-cell *matCellDef="let element" class="!bg-white text-xs"> {{element.ListOfOrders}} </td>
                </ng-container>

                <!-- SyncType  Column -->
                <ng-container matColumnDef="SyncType">
                    <th mat-header-cell *matHeaderCellDef class="!bg-gray-50 text-xs !h-fit"> Sync Type</th>
                    <td mat-cell *matCellDef="let element" class="!bg-white text-xs"> {{element.SyncType}} </td>
                </ng-container>
                <!-- SyncDoneBy Column -->
                <ng-container matColumnDef="SyncDoneBy">
                    <th mat-header-cell *matHeaderCellDef class="!bg-gray-50 text-xs !h-fit"> Sync Done By</th>
                    <td mat-cell *matCellDef="let element" class="!bg-white text-xs"> {{element.SyncDoneBy}} </td>
                </ng-container>
                <!-- SyncDate Column -->
                <ng-container matColumnDef="SyncDate">
                    <th mat-header-cell *matHeaderCellDef class="!bg-gray-50 text-xs !h-fit">Sync Date</th>
                    <td mat-cell *matCellDef="let element" class="!bg-white text-xs"> {{element.SyncDate | date:'medium'}} </td>
                </ng-container>
              
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
            <mat-paginator [length]="dataSource.data.length" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons
                aria-label="Select page of periodic elements" class="!bg-white mt-2 w-full">
            </mat-paginator>
        </div>
    </div>
</div>
